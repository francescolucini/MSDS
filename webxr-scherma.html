<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WebXR Scherma VR</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; overflow: hidden; font-family: monospace; color: #ff6644; }
#overlay {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 10;
  background: radial-gradient(ellipse at center, #1a0a0a 0%, #000 100%);
  padding: 20px; text-align: center;
}
h1 { font-size: 2.5rem; letter-spacing: 0.2em; text-shadow: 0 0 20px #ff664488; margin-bottom: 0.3em; }
p { color: #aaa; margin-bottom: 1.5em; line-height: 1.8; max-width: 400px; }
p span { color: #ff6644; }
#btn {
  padding: 1em 2.5em; font-size: 1rem; font-family: monospace;
  letter-spacing: 0.15em; text-transform: uppercase;
  background: transparent; border: 2px solid #ff6644; color: #ff6644; cursor: pointer;
}
#btn:hover { background: #ff6644; color: #000; }
#log { margin-top: 1em; font-size: 0.7rem; color: #888; max-width: 420px; line-height: 1.8; }
#hud {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  font-size: 1.2rem; letter-spacing: 0.15em; color: #ff6644;
  text-shadow: 0 0 10px #ff6644; z-index: 20; display: none;
  text-align: center;
}
canvas { display: block; }
</style>
</head>
<body>
<div id="overlay">
  <h1>SCHERMA VR</h1>
  <p>Quest 3 - WebXR - Controllers<br><br>
    <span>Mano destra</span>: Spada - colpisci il nemico!<br>
    <span>Mano sinistra</span>: Scudo - para gli attacchi!<br><br>
    3 colpi per uccidere il nemico.<br>
    3 colpi subiti = Game Over.
  </p>
  <button id="btn">Enter VR</button>
  <div id="log"></div>
</div>
<div id="hud">
  <div>NEMICI: <span id="kills">0</span></div>
  <div style="margin-top:8px">
    <span id="playerHealth">&#9829; &#9829; &#9829;</span>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

const logEl = document.getElementById('log');
function log(msg) { console.log(msg); logEl.innerHTML += msg + '<br>'; }

// Audio
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playHitEnemy() {
  ensureAudio();
  const t = audioCtx.currentTime;
  // Metal clang
  const osc1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(800 + Math.random() * 200, t);
  osc1.frequency.exponentialRampToValueAtTime(200, t + 0.15);
  g1.gain.setValueAtTime(0.3, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc1.connect(g1); g1.connect(audioCtx.destination);
  osc1.start(t); osc1.stop(t + 0.15);
  // Impact
  const osc2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(150, t);
  osc2.frequency.exponentialRampToValueAtTime(50, t + 0.1);
  g2.gain.setValueAtTime(0.2, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc2.connect(g2); g2.connect(audioCtx.destination);
  osc2.start(t); osc2.stop(t + 0.1);
}

function playBlock() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(300, t);
  osc.frequency.exponentialRampToValueAtTime(100, t + 0.08);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.08);
}

function playPlayerHit() {
  ensureAudio();
  const t = audioCtx.currentTime;
  // Pain sound
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(80, t + 0.3);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.3);
}

function playEnemyDeath() {
  ensureAudio();
  const t = audioCtx.currentTime;
  [200, 150, 100, 60].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.15, t + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.2);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t + i * 0.1); osc.stop(t + i * 0.1 + 0.2);
  });
}

function playVictoryChime() {
  ensureAudio();
  const t = audioCtx.currentTime;
  [523, 659, 784, 1047].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.12, t + i * 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.4);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.4);
  });
}

function playGameOver() {
  ensureAudio();
  const t = audioCtx.currentTime;
  [300, 250, 200, 150].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.2, t + i * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.2 + 0.4);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t + i * 0.2); osc.stop(t + i * 0.2 + 0.4);
  });
}

function playSwordSwing() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, t);
  osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.1);
}

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.FogExp2(0x0a0a12, 0.15);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0x334466, 0.8));
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
dirLight.position.set(3, 8, 3);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const torchLight1 = new THREE.PointLight(0xff6622, 2, 10);
torchLight1.position.set(-3, 2.5, -3);
scene.add(torchLight1);
const torchLight2 = new THREE.PointLight(0xff6622, 2, 10);
torchLight2.position.set(3, 2.5, -3);
scene.add(torchLight2);

// Arena floor
const floorGeo = new THREE.CircleGeometry(5, 32);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Arena ring
const ringGeo = new THREE.TorusGeometry(5, 0.1, 8, 64);
const ringMat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 0.3, metalness: 0.8 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.05;
scene.add(ring);

// Grid
const grid = new THREE.GridHelper(10, 20, 0x222233, 0x111122);
grid.position.y = 0.01;
scene.add(grid);

// Sword (right hand)
function createSword() {
  const group = new THREE.Group();

  // Blade
  const bladeGeo = new THREE.BoxGeometry(0.02, 0.8, 0.005);
  const bladeMat = new THREE.MeshStandardMaterial({
    color: 0xccccdd, roughness: 0.1, metalness: 0.95,
    emissive: 0x222233, emissiveIntensity: 0.2
  });
  const blade = new THREE.Mesh(bladeGeo, bladeMat);
  blade.position.y = 0.4;
  blade.castShadow = true;
  group.add(blade);

  // Blade edge glow
  const edgeGeo = new THREE.BoxGeometry(0.022, 0.8, 0.001);
  const edgeMat = new THREE.MeshBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.5 });
  const edge = new THREE.Mesh(edgeGeo, edgeMat);
  edge.position.y = 0.4;
  edge.position.z = 0.004;
  group.add(edge);

  // Guard
  const guardGeo = new THREE.BoxGeometry(0.15, 0.02, 0.02);
  const guardMat = new THREE.MeshStandardMaterial({ color: 0x886633, roughness: 0.3, metalness: 0.7 });
  const guard = new THREE.Mesh(guardGeo, guardMat);
  guard.castShadow = true;
  group.add(guard);

  // Handle
  const handleGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.12, 8);
  const handleMat = new THREE.MeshStandardMaterial({ color: 0x442211, roughness: 0.8 });
  const handle = new THREE.Mesh(handleGeo, handleMat);
  handle.position.y = -0.06;
  group.add(handle);

  // Pommel
  const pommelGeo = new THREE.SphereGeometry(0.02, 8, 8);
  const pommel = new THREE.Mesh(pommelGeo, guardMat);
  pommel.position.y = -0.13;
  group.add(pommel);

  // Rotate sword to point forward from controller grip
  group.rotation.x = -Math.PI / 2;

  return group;
}

// Shield (left hand)
function createShield() {
  const group = new THREE.Group();

  // Main shield body
  const shieldGeo = new THREE.CylinderGeometry(0.2, 0.18, 0.03, 6);
  const shieldMat = new THREE.MeshStandardMaterial({
    color: 0x664422, roughness: 0.6, metalness: 0.3
  });
  const shield = new THREE.Mesh(shieldGeo, shieldMat);
  shield.rotation.x = Math.PI / 2;
  shield.castShadow = true;
  group.add(shield);

  // Shield boss (center)
  const bossGeo = new THREE.SphereGeometry(0.05, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
  const bossMat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 0.2, metalness: 0.8 });
  const boss = new THREE.Mesh(bossGeo, bossMat);
  boss.rotation.x = -Math.PI / 2;
  boss.position.z = 0.015;
  group.add(boss);

  // Shield rim
  const rimGeo = new THREE.TorusGeometry(0.19, 0.015, 8, 6);
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 0.3, metalness: 0.7 });
  const rim = new THREE.Mesh(rimGeo, rimMat);
  rim.position.z = 0.015;
  group.add(rim);

  // Rotate to face forward
  group.rotation.y = Math.PI;

  return group;
}

// Enemy
function createEnemy() {
  const group = new THREE.Group();
  group.userData = {
    health: 3,
    state: 'idle', // idle, approaching, attacking, retreating, dying, feinting
    attackCooldown: 0,
    hitCooldown: 0,
    attackTimer: 0,
    swordTipWorld: new THREE.Vector3(),
    prevSwordTipWorld: new THREE.Vector3(),
    // Unpredictable attack variables
    attackType: 'center', // center, high, low, left, right
    attackSpeed: 1.0,
    feinting: false,
    feintTimer: 0,
    swordOffsetX: 0,
    swordOffsetY: 0,
    idleSwayPhase: Math.random() * Math.PI * 2
  };

  // Body
  const bodyGeo = new THREE.CapsuleGeometry(0.2, 0.5, 4, 8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x442222, roughness: 0.7 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.95;
  body.castShadow = true;
  group.add(body);
  group.userData.bodyMesh = body;

  // Head
  const headGeo = new THREE.SphereGeometry(0.15, 12, 8);
  const headMat = new THREE.MeshStandardMaterial({ color: 0x553333, roughness: 0.6 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.5;
  head.castShadow = true;
  group.add(head);

  // Eyes (glowing red)
  const eyeGeo = new THREE.SphereGeometry(0.025, 8, 8);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2200 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.05, 1.52, 0.12);
  group.add(leftEye);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.05, 1.52, 0.12);
  group.add(rightEye);
  group.userData.eyes = [leftEye, rightEye];

  // Enemy sword arm
  const armGeo = new THREE.CapsuleGeometry(0.05, 0.3, 4, 8);
  const armMat = new THREE.MeshStandardMaterial({ color: 0x442222, roughness: 0.7 });
  const arm = new THREE.Mesh(armGeo, armMat);
  arm.position.set(0.25, 1.1, 0.1);
  arm.rotation.z = -Math.PI / 6;
  arm.rotation.x = Math.PI / 4;
  group.add(arm);
  group.userData.arm = arm;

  // Enemy sword - positioned to thrust forward
  const enemySword = createEnemySword();
  enemySword.position.set(0.25, 1.0, 0.2);
  enemySword.rotation.x = Math.PI / 3; // Angled forward
  group.add(enemySword);
  group.userData.sword = enemySword;

  // Health indicator (3 gems above head)
  const healthGroup = new THREE.Group();
  healthGroup.position.y = 1.8;
  for (let i = 0; i < 3; i++) {
    const gemGeo = new THREE.OctahedronGeometry(0.04);
    const gemMat = new THREE.MeshStandardMaterial({
      color: 0xff4444, emissive: 0xff2222, emissiveIntensity: 0.5,
      roughness: 0.2, metalness: 0.8
    });
    const gem = new THREE.Mesh(gemGeo, gemMat);
    gem.position.x = (i - 1) * 0.1;
    healthGroup.add(gem);
  }
  group.add(healthGroup);
  group.userData.healthGems = healthGroup.children;

  return group;
}

function createEnemySword() {
  const group = new THREE.Group();

  const bladeGeo = new THREE.BoxGeometry(0.025, 0.7, 0.008);
  const bladeMat = new THREE.MeshStandardMaterial({
    color: 0x332222, roughness: 0.2, metalness: 0.9,
    emissive: 0x110000, emissiveIntensity: 0.3
  });
  const blade = new THREE.Mesh(bladeGeo, bladeMat);
  blade.position.y = 0.35;
  group.add(blade);

  // Tip marker for collision
  const tipMarker = new THREE.Object3D();
  tipMarker.position.y = 0.7;
  group.add(tipMarker);
  group.userData.tip = tipMarker;

  const guardGeo = new THREE.BoxGeometry(0.12, 0.02, 0.02);
  const guardMat = new THREE.MeshStandardMaterial({ color: 0x443322, roughness: 0.4, metalness: 0.6 });
  const guard = new THREE.Mesh(guardGeo, guardMat);
  group.add(guard);

  return group;
}

// Particles
const particles = [];
const particleGeo = new THREE.SphereGeometry(0.02, 4, 4);

function spawnParticles(position, color, count = 15) {
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const mesh = new THREE.Mesh(particleGeo, mat);
    mesh.position.copy(position);
    scene.add(mesh);
    particles.push({
      mesh,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 3,
        Math.random() * 2 + 1,
        (Math.random() - 0.5) * 3
      ),
      life: 0.8 + Math.random() * 0.4,
      maxLife: 0.8 + Math.random() * 0.4
    });
  }
}

function spawnSparks(position) {
  for (let i = 0; i < 20; i++) {
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(0.1 + Math.random() * 0.1, 1, 0.5 + Math.random() * 0.3),
      transparent: true, opacity: 1
    });
    const mesh = new THREE.Mesh(particleGeo, mat);
    mesh.position.copy(position);
    mesh.scale.setScalar(0.5);
    scene.add(mesh);
    particles.push({
      mesh,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 5,
        Math.random() * 3,
        (Math.random() - 0.5) * 5
      ),
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.4 + Math.random() * 0.3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.vel.y -= 5 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    const t = p.life / p.maxLife;
    p.mesh.material.opacity = t;
    p.mesh.scale.setScalar(t);
  }
}

// Controllers
const controllerModelFactory = new XRControllerModelFactory();

const controller0 = renderer.xr.getController(0);
scene.add(controller0);
const controller1 = renderer.xr.getController(1);
scene.add(controller1);

const grip0 = renderer.xr.getControllerGrip(0);
grip0.add(controllerModelFactory.createControllerModel(grip0));
scene.add(grip0);
const grip1 = renderer.xr.getControllerGrip(1);
grip1.add(controllerModelFactory.createControllerModel(grip1));
scene.add(grip1);

// Sword and shield attached to grips
const playerSword = createSword();
const playerShield = createShield();

let swordGrip = null;
let shieldGrip = null;

// Game state
let playerHealth = 3;
let killCount = 0;
let enemy = null;
let gameOver = false;
let gameOverTimer = 0;

// Sword tracking for velocity
const swordTipWorld = new THREE.Vector3();
const prevSwordTipWorld = new THREE.Vector3();
let swordSpeed = 0;

// Shield tracking
const shieldCenterWorld = new THREE.Vector3();

// HUD in VR
const hudCanvas = document.createElement('canvas');
hudCanvas.width = 512;
hudCanvas.height = 256;
const hudCtx = hudCanvas.getContext('2d');
const hudTexture = new THREE.CanvasTexture(hudCanvas);
const hudMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.3),
  new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, opacity: 0.9 })
);
hudMesh.position.set(0, 2.2, -2);
scene.add(hudMesh);

function drawVRHUD() {
  const ctx = hudCtx;
  ctx.clearRect(0, 0, 512, 256);

  // Background
  ctx.fillStyle = 'rgba(10, 10, 20, 0.8)';
  ctx.beginPath();
  ctx.roundRect(10, 10, 492, 236, 16);
  ctx.fill();

  // Border
  ctx.strokeStyle = gameOver ? '#ff2222' : '#ff6644';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(10, 10, 492, 236, 16);
  ctx.stroke();

  ctx.textAlign = 'center';

  if (gameOver) {
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GAME OVER', 256, 100);
    ctx.fillStyle = '#aaa';
    ctx.font = '28px monospace';
    ctx.fillText(`Nemici sconfitti: ${killCount}`, 256, 150);
    ctx.fillStyle = '#ff6644';
    ctx.font = '22px monospace';
    ctx.fillText('Ricarica per ricominciare', 256, 200);
  } else {
    // Kill count
    ctx.fillStyle = '#ff6644';
    ctx.font = 'bold 36px monospace';
    ctx.fillText(`NEMICI: ${killCount}`, 256, 60);

    // Player health
    ctx.font = '40px monospace';
    let hearts = '';
    for (let i = 0; i < 3; i++) {
      hearts += i < playerHealth ? '\u2665 ' : '\u2661 ';
    }
    ctx.fillStyle = playerHealth > 1 ? '#ff4466' : '#ff2222';
    ctx.fillText(hearts, 256, 120);

    // Enemy health
    if (enemy && enemy.userData.health > 0) {
      ctx.fillStyle = '#888';
      ctx.font = '24px monospace';
      ctx.fillText('Nemico:', 256, 170);
      let enemyHealth = '';
      for (let i = 0; i < 3; i++) {
        enemyHealth += i < enemy.userData.health ? '\u25C6 ' : '\u25C7 ';
      }
      ctx.fillStyle = '#ff4444';
      ctx.font = '32px monospace';
      ctx.fillText(enemyHealth, 256, 210);
    }
  }

  hudTexture.needsUpdate = true;
}

function updateHTMLHUD() {
  document.getElementById('kills').textContent = killCount;
  let hearts = '';
  for (let i = 0; i < 3; i++) {
    hearts += i < playerHealth ? '\u2665 ' : '\u2661 ';
  }
  document.getElementById('playerHealth').innerHTML = hearts;
}

function spawnEnemy() {
  if (enemy) {
    scene.remove(enemy);
  }
  enemy = createEnemy();
  // Spawn in front of player
  const angle = (Math.random() - 0.5) * Math.PI * 0.5;
  enemy.position.set(Math.sin(angle) * 3, 0, -Math.cos(angle) * 3);
  enemy.lookAt(0, 0, 0);
  scene.add(enemy);
}

function hitEnemy() {
  if (!enemy || enemy.userData.hitCooldown > 0 || enemy.userData.state === 'dying') return;

  enemy.userData.health--;
  enemy.userData.hitCooldown = 0.5;

  // Update health gems
  enemy.userData.healthGems.forEach((gem, i) => {
    gem.visible = i < enemy.userData.health;
  });

  // Flash enemy
  enemy.userData.bodyMesh.material.emissive = new THREE.Color(0xff0000);
  enemy.userData.bodyMesh.material.emissiveIntensity = 1;
  setTimeout(() => {
    if (enemy && enemy.userData.bodyMesh) {
      enemy.userData.bodyMesh.material.emissive = new THREE.Color(0x000000);
      enemy.userData.bodyMesh.material.emissiveIntensity = 0;
    }
  }, 100);

  // Particles
  const hitPos = swordTipWorld.clone();
  spawnParticles(hitPos, 0xff4444);
  spawnSparks(hitPos);
  playHitEnemy();

  // Haptic feedback
  triggerHaptic(swordGrip === grip0 ? 0 : 1, 0.8, 100);

  // Enemy retreat
  enemy.userData.state = 'retreating';
  enemy.userData.attackCooldown = 1.5;

  if (enemy.userData.health <= 0) {
    killEnemy();
  }
}

function killEnemy() {
  enemy.userData.state = 'dying';
  playEnemyDeath();
  playVictoryChime();
  killCount++;
  updateHTMLHUD();

  // Big particle explosion
  spawnParticles(enemy.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xff2222, 40);

  // Spawn new enemy after delay
  setTimeout(() => {
    spawnEnemy();
  }, 2000);
}

function hitPlayer() {
  if (gameOver) return;

  playerHealth--;
  updateHTMLHUD();
  playPlayerHit();

  // Screen flash effect (red tint on HUD)

  // Haptic on both controllers
  triggerHaptic(0, 1.0, 200);
  triggerHaptic(1, 1.0, 200);

  if (playerHealth <= 0) {
    gameOver = true;
    gameOverTimer = 0;
    playGameOver();
  }
}

function triggerHaptic(controllerIndex, intensity, duration) {
  const session = renderer.xr.getSession();
  if (!session) return;

  for (const source of session.inputSources) {
    const gp = source.gamepad;
    if (!gp) continue;

    const isCorrectController =
      (controllerIndex === 0 && source.handedness === 'left') ||
      (controllerIndex === 1 && source.handedness === 'right');

    if (isCorrectController) {
      if (gp.hapticActuators && gp.hapticActuators.length > 0) {
        gp.hapticActuators[0].pulse(intensity, duration);
      }
      if (gp.vibrationActuator) {
        gp.vibrationActuator.playEffect('dual-rumble', {
          duration,
          strongMagnitude: intensity,
          weakMagnitude: intensity * 0.7
        }).catch(() => {});
      }
    }
  }
}

function updateEnemy(dt) {
  if (!enemy || gameOver) return;

  const data = enemy.userData;
  data.hitCooldown = Math.max(0, data.hitCooldown - dt);
  data.attackCooldown = Math.max(0, data.attackCooldown - dt);

  if (data.state === 'dying') return;

  // Get player position (camera)
  const xrCam = renderer.xr.getCamera();
  const playerPos = new THREE.Vector3().setFromMatrixPosition(xrCam.matrixWorld);
  playerPos.y = 0;

  const enemyPos = enemy.position.clone();
  enemyPos.y = 0;

  const toPlayer = playerPos.clone().sub(enemyPos);
  const distToPlayer = toPlayer.length();
  toPlayer.normalize();

  // Face player
  enemy.lookAt(playerPos.x, enemy.position.y, playerPos.z);

  // AI behavior
  const attackRange = 1.2;
  const approachRange = 2.5;

  // Attack type offsets
  const attackOffsets = {
    center: { x: 0, y: 0 },
    high: { x: 0, y: 0.4 },
    low: { x: 0, y: -0.3 },
    left: { x: -0.3, y: 0.1 },
    right: { x: 0.3, y: 0.1 }
  };

  if (data.state === 'feinting') {
    // Fake attack - pull back at last moment
    data.feintTimer += dt * 3;
    const fakeProgress = Math.sin(data.feintTimer * Math.PI * 0.7);

    // Move sword as if attacking but stop early
    data.sword.position.z = 0.2 + fakeProgress * 0.3;
    data.sword.position.x = 0.25 + data.swordOffsetX * fakeProgress * 0.5;
    data.sword.position.y = 1.0 + data.swordOffsetY * fakeProgress * 0.5;
    data.sword.rotation.x = Math.PI / 3 + fakeProgress * 0.3;

    if (data.feintTimer > 0.5) {
      // Now do real attack from different angle
      data.state = 'attacking';
      data.attackTimer = 0;
      // Change attack direction after feint
      const types = ['high', 'low', 'left', 'right', 'center'];
      data.attackType = types[Math.floor(Math.random() * types.length)];
      const offset = attackOffsets[data.attackType];
      data.swordOffsetX = offset.x + (Math.random() - 0.5) * 0.15;
      data.swordOffsetY = offset.y + (Math.random() - 0.5) * 0.1;
      data.attackSpeed = 2.0 + Math.random() * 1.5; // Faster after feint
    }
  } else if (data.state === 'attacking') {
    // Execute attack animation with variable speed
    data.attackTimer += dt * data.attackSpeed;

    // Thrust sword forward with offset based on attack type
    const thrustProgress = Math.sin(data.attackTimer * Math.PI);

    // Add slight random wobble during attack
    const wobbleX = Math.sin(data.attackTimer * 12) * 0.03;
    const wobbleY = Math.cos(data.attackTimer * 15) * 0.02;

    // Apply attack direction
    data.sword.position.x = 0.25 + data.swordOffsetX * thrustProgress + wobbleX;
    data.sword.position.y = 1.0 + data.swordOffsetY * thrustProgress + wobbleY;
    data.sword.position.z = 0.2 + thrustProgress * 0.7;

    // Rotate sword toward attack direction
    data.sword.rotation.x = Math.PI / 3 + thrustProgress * 0.5;
    data.sword.rotation.y = data.swordOffsetX * thrustProgress * 0.5;
    data.sword.rotation.z = -data.swordOffsetY * thrustProgress * 0.3;

    // Get sword tip position (updateWorldMatrix(true) ensures parent chain is fresh)
    data.prevSwordTipWorld.copy(data.swordTipWorld);
    data.sword.updateWorldMatrix(true, false);
    const tipLocal = data.sword.userData.tip;
    tipLocal.getWorldPosition(data.swordTipWorld);

    // Check if sword hits player (collision with player body area)
    const swordTip = data.swordTipWorld;
    const playerBodyPos = playerPos.clone();
    playerBodyPos.y = 1.2 + data.swordOffsetY * 0.5; // Adjust hit zone based on attack type

    const distToPlayerBody = swordTip.distanceTo(playerBodyPos);

    // Also check midpoint of enemy sword trajectory to catch fast attacks tunneling through
    const enemySwordMid = data.prevSwordTipWorld.clone().lerp(data.swordTipWorld, 0.5);

    const checkBlockCylinder = (tip) => {
      const dShield = Math.sqrt(Math.pow(tip.x - shieldCenterWorld.x, 2) + Math.pow(tip.z - shieldCenterWorld.z, 2));
      if (dShield < 0.6 && Math.abs(tip.y - shieldCenterWorld.y) < 0.7) return 'shield';
      const dSword = Math.sqrt(Math.pow(tip.x - swordTipWorld.x, 2) + Math.pow(tip.z - swordTipWorld.z, 2));
      if (dSword < 0.5 && Math.abs(tip.y - swordTipWorld.y) < 0.6) return 'sword';
      return null;
    };

    const blockResult = checkBlockCylinder(swordTip) || checkBlockCylinder(enemySwordMid);
    const shieldBlocking = blockResult === 'shield';
    const swordBlocking = blockResult === 'sword';

    if (data.attackTimer > 0.15 && data.attackTimer < 0.85) {
      if (shieldBlocking || swordBlocking) {
        // Blocked!
        playBlock();
        spawnSparks(swordTip.clone());
        triggerHaptic(shieldBlocking ? (shieldGrip === grip0 ? 0 : 1) : (swordGrip === grip0 ? 0 : 1), 0.6, 80);
        data.state = 'retreating';
        data.attackCooldown = 1.5 + Math.random() * 1.0;
        data.attackTimer = 0;
      } else if (distToPlayerBody < 0.5) {
        // Hit player!
        hitPlayer();
        data.state = 'retreating';
        data.attackCooldown = 1.5 + Math.random() * 1.0;
        data.attackTimer = 0;
      }
    }

    if (data.attackTimer > 1) {
      data.state = 'retreating';
      data.attackCooldown = 1.0 + Math.random() * 1.0;
      data.attackTimer = 0;
    }
  } else if (data.state === 'retreating') {
    // Move away
    enemy.position.addScaledVector(toPlayer, -1.5 * dt);

    // Reset sword position smoothly
    data.sword.rotation.x = THREE.MathUtils.lerp(data.sword.rotation.x, Math.PI / 3, dt * 5);
    data.sword.rotation.y = THREE.MathUtils.lerp(data.sword.rotation.y, 0, dt * 5);
    data.sword.rotation.z = THREE.MathUtils.lerp(data.sword.rotation.z, 0, dt * 5);
    data.sword.position.x = THREE.MathUtils.lerp(data.sword.position.x, 0.25, dt * 5);
    data.sword.position.z = THREE.MathUtils.lerp(data.sword.position.z, 0.2, dt * 5);
    data.sword.position.y = THREE.MathUtils.lerp(data.sword.position.y, 1.0, dt * 5);

    if (distToPlayer > approachRange || data.attackCooldown <= 0) {
      data.state = 'idle';
    }
  } else {
    // Idle / approaching - menacing sword movement
    data.idleSwayPhase += dt * 2;

    // Unpredictable idle sword movement
    const swayX = Math.sin(data.idleSwayPhase) * 0.08 + Math.sin(data.idleSwayPhase * 2.3) * 0.04;
    const swayY = Math.cos(data.idleSwayPhase * 1.7) * 0.06 + Math.sin(data.idleSwayPhase * 0.8) * 0.03;
    const swayZ = Math.sin(data.idleSwayPhase * 1.3) * 0.05;

    data.sword.position.x = 0.25 + swayX;
    data.sword.position.y = 1.0 + swayY;
    data.sword.position.z = 0.2 + swayZ;
    data.sword.rotation.x = Math.PI / 3 + swayY * 0.3;
    data.sword.rotation.y = swayX * 0.4;
    data.sword.rotation.z = swayY * 0.2;

    if (distToPlayer > attackRange) {
      // Approach with slight side-stepping
      const sideStep = Math.sin(data.idleSwayPhase * 0.5) * 0.3;
      const right = new THREE.Vector3().crossVectors(toPlayer, new THREE.Vector3(0, 1, 0)).normalize();
      enemy.position.addScaledVector(toPlayer, 1.0 * dt);
      enemy.position.addScaledVector(right, sideStep * dt);
      data.state = 'approaching';
    } else if (data.attackCooldown <= 0) {
      // Decide attack pattern
      const attackTypes = ['center', 'high', 'low', 'left', 'right'];
      data.attackType = attackTypes[Math.floor(Math.random() * attackTypes.length)];

      // Set up attack offsets with randomness
      const offset = attackOffsets[data.attackType];
      data.swordOffsetX = offset.x + (Math.random() - 0.5) * 0.2;
      data.swordOffsetY = offset.y + (Math.random() - 0.5) * 0.15;

      // Random attack speed
      data.attackSpeed = 2.0 + Math.random() * 1.0;

      // 30% chance to feint first
      if (Math.random() < 0.3) {
        data.state = 'feinting';
        data.feintTimer = 0;
        // Feint from different direction than real attack will be
        const feintTypes = attackTypes.filter(t => t !== data.attackType);
        const feintType = feintTypes[Math.floor(Math.random() * feintTypes.length)];
        const feintOffset = attackOffsets[feintType];
        data.swordOffsetX = feintOffset.x;
        data.swordOffsetY = feintOffset.y;
      } else {
        data.state = 'attacking';
        data.attackTimer = 0;
      }
    }
  }

  // Animate eyes
  const eyePulse = 0.8 + Math.sin(performance.now() / 200) * 0.2;
  data.eyes.forEach(eye => {
    eye.material.color.setRGB(eyePulse, eyePulse * 0.2, 0);
  });

  // Animate health gems
  data.healthGems.forEach((gem, i) => {
    if (gem.visible) {
      gem.rotation.y += dt * 2;
      gem.position.y = Math.sin(performance.now() / 500 + i) * 0.02;
    }
  });
}

function checkSwordHit() {
  if (!enemy || enemy.userData.state === 'dying' || enemy.userData.hitCooldown > 0) return;

  // Check if sword is moving fast enough
  if (swordSpeed < 0.6) return;

  // Check collision with enemy body using cylinder: XZ distance + Y range
  const checkHitCylinder = (tip) => {
    const dxz = Math.sqrt(Math.pow(tip.x - enemy.position.x, 2) + Math.pow(tip.z - enemy.position.z, 2));
    return dxz < 0.6 && tip.y > 0.2 && tip.y < 2.0;
  };

  // Also check midpoint to catch fast swings that tunnel through in one frame
  const swordMidWorld = prevSwordTipWorld.clone().lerp(swordTipWorld, 0.5);

  if (checkHitCylinder(swordTipWorld) || checkHitCylinder(swordMidWorld)) {
    hitEnemy();
    playSwordSwing();
  }
}

// XR session
const btn = document.getElementById('btn');
const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
let xrSession = null;

const ATTEMPTS = [
  ['immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] }],
  ['immersive-vr', { optionalFeatures: ['local-floor'] }],
  ['immersive-vr', {}]
];

function trySession(idx) {
  if (idx >= ATTEMPTS.length) { log('All attempts failed.'); return; }
  const mode = ATTEMPTS[idx][0];
  const opts = ATTEMPTS[idx][1];
  log('Trying ' + mode + '...');

  navigator.xr.requestSession(mode, opts).then(session => {
    log('Session started!');
    xrSession = session;
    renderer.xr.setReferenceSpaceType('local-floor');

    const gl = renderer.getContext();
    const glLayer = new XRWebGLLayer(session, gl, {
      framebufferScaleFactor: XRWebGLLayer.getNativeFramebufferScaleFactor(session),
      antialias: true
    });
    session.updateRenderState({ baseLayer: glLayer });
    renderer.xr.setSession(session);

    overlay.style.display = 'none';
    hud.style.display = 'block';

    // Spawn first enemy
    spawnEnemy();

    session.addEventListener('end', () => {
      xrSession = null;
      overlay.style.display = 'flex';
      hud.style.display = 'none';
    });
  }).catch(e => {
    log('Failed: ' + e.message);
    trySession(idx + 1);
  });
}

btn.addEventListener('click', () => {
  if (!navigator.xr) { log('WebXR not available'); return; }
  ensureAudio();
  trySession(0);
});

if (!navigator.xr) {
  log('WebXR not found. Need HTTPS.');
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
let prevTime = 0;

renderer.setAnimationLoop((timestamp, frame) => {
  const now = performance.now();
  const dt = prevTime > 0 ? Math.min((now - prevTime) / 1000, 0.1) : 0.016;
  prevTime = now;

  // Animate torch lights
  torchLight1.intensity = 2 + Math.sin(now / 200) * 0.3 + Math.random() * 0.1;
  torchLight2.intensity = 2 + Math.cos(now / 180) * 0.3 + Math.random() * 0.1;

  if (frame && renderer.xr.isPresenting) {
    const session = renderer.xr.getSession();

    // Determine which grip is which hand
    for (const source of session.inputSources) {
      if (source.handedness === 'right') {
        const rightGrip = source.gripSpace ? (grip0.children.length > 0 && grip0.position.distanceTo(controller0.position) < 0.01 ? grip0 : grip1) : null;
        // Attach sword to right hand
        if (swordGrip !== grip0 && swordGrip !== grip1) {
          grip1.add(playerSword);
          swordGrip = grip1;
        }
      }
      if (source.handedness === 'left') {
        // Attach shield to left hand
        if (shieldGrip !== grip0 && shieldGrip !== grip1) {
          grip0.add(playerShield);
          shieldGrip = grip0;
        }
      }
    }

    // Assign based on input sources
    for (const source of session.inputSources) {
      if (source.handedness === 'right' && source.gripSpace) {
        if (!playerSword.parent || playerSword.parent === scene) {
          // Determine which grip corresponds to this source
          const pose = frame.getPose(source.gripSpace, renderer.xr.getReferenceSpace());
          if (pose) {
            const rightPos = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
            const d0 = rightPos.distanceTo(grip0.position);
            const d1 = rightPos.distanceTo(grip1.position);
            swordGrip = d0 < d1 ? grip0 : grip1;
            swordGrip.add(playerSword);
          }
        }
      }
      if (source.handedness === 'left' && source.gripSpace) {
        if (!playerShield.parent || playerShield.parent === scene) {
          const pose = frame.getPose(source.gripSpace, renderer.xr.getReferenceSpace());
          if (pose) {
            const leftPos = new THREE.Vector3(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
            const d0 = leftPos.distanceTo(grip0.position);
            const d1 = leftPos.distanceTo(grip1.position);
            shieldGrip = d0 < d1 ? grip0 : grip1;
            shieldGrip.add(playerShield);
          }
        }
      }
    }

    // Update sword tip position
    if (playerSword.parent) {
      playerSword.updateWorldMatrix(true, false);
      const tipOffset = new THREE.Vector3(0, 0, -0.8);
      tipOffset.applyMatrix4(playerSword.matrixWorld);
      prevSwordTipWorld.copy(swordTipWorld);
      swordTipWorld.copy(tipOffset);
      swordSpeed = swordTipWorld.distanceTo(prevSwordTipWorld) / dt;
    }

    // Update shield center
    if (playerShield.parent) {
      playerShield.updateMatrixWorld();
      playerShield.getWorldPosition(shieldCenterWorld);
    }

    // Game logic
    if (!gameOver) {
      updateEnemy(dt);
      checkSwordHit();
    } else {
      gameOverTimer += dt;
    }

    drawVRHUD();
  }

  updateParticles(dt);
  renderer.render(scene, camera);
});
</script>
